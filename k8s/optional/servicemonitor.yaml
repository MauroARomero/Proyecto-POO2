# Requiere kube-prometheus-stack instalado (ver monitoring/README.md).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tienda-api
  namespace: tienda
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: api
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
